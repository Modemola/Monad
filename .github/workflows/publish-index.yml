# Keeps the Ingot index alive.
#
# A seeded deployment has history but no future: without ongoing prints the index goes stale,
# the mark drifts away from the market, and the front contract can never settle, because
# settlement needs a print covering the right edge of its delivery window. This publishes the
# current rate on a schedule so the deployed product is still live when someone opens it.
#
# Requires one repository secret:
#   DEPLOYER_PRIVATE_KEY   the testnet publisher key (the deployer is allowlisted at deploy time)

name: publish index

on:
  schedule:
    - cron: "17 */6 * * *" # every six hours, off the hour to avoid the stampede
  workflow_dispatch:

concurrency:
  group: publish-index
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.5.1

      - name: Compute the print
        id: print
        run: |
          node tools/publish-index.mjs --json > print.json
          cat print.json
          echo "price=$(jq -r .priceWei print.json)"   >> "$GITHUB_OUTPUT"
          echo "samples=$(jq -r .sampleCount print.json)" >> "$GITHUB_OUTPUT"
          echo "sources=$(jq -r .sourceCount print.json)" >> "$GITHUB_OUTPUT"

      # Nothing to publish to until the deploy workflow has recorded a deployment; skip cleanly
      # rather than failing four times a day.
      - name: Resolve the index address
        id: addr
        run: |
          if [ ! -f contracts/deployments/10143.json ]; then
            echo "no Monad testnet deployment recorded yet; skipping"
            exit 0
          fi
          echo "index=$(jq -r .index contracts/deployments/10143.json)" >> "$GITHUB_OUTPUT"

      - name: Publish onchain
        if: steps.addr.outputs.index != ''
        env:
          RPC: https://testnet-rpc.monad.xyz
          KEY: ${{ secrets.DEPLOYER_PRIVATE_KEY }}
        run: |
          set -euo pipefail

          INDEX="${{ steps.addr.outputs.index }}"
          PRICE="${{ steps.print.outputs.price }}"

          # `observedAt` must advance past the newest print — provisional ones included, since a
          # CRE print may have landed since the last finalized one — by at most the clock and at
          # least the index's minimum interval. The contract also rejects a print outside the
          # deviation band, so a broken upstream feed fails here rather than repricing the market.
          COUNT=$(cast call "$INDEX" 'observationCount()(uint256)' --rpc-url "$RPC" | awk '{print $1}')
          LAST=$(cast call "$INDEX" 'observation(uint256)((uint64,uint64,uint32,uint16,uint256,uint256))' \
            "$((COUNT - 1))" --rpc-url "$RPC" | tr -d '(' | awk -F'[ ,]' '{print $1}')
          MIN=$(cast call "$INDEX" 'minInterval()(uint32)' --rpc-url "$RPC" | awk '{print $1}')
          # The chain's clock, not the runner's: a runner even a second ahead of the latest block
          # would be rejected as a print from the future.
          NOW=$(cast block latest --field timestamp --rpc-url "$RPC")

          if [ "$NOW" -lt "$((LAST + MIN))" ]; then
            echo "newest print at $LAST is under ${MIN}s old; nothing to do"
            exit 0
          fi

          cast send "$INDEX" 'publish(uint64,uint256,uint32,uint16)' \
            "$NOW" "$PRICE" "${{ steps.print.outputs.samples }}" "${{ steps.print.outputs.sources }}" \
            --rpc-url "$RPC" --private-key "$KEY" \
            | grep -E 'status|transactionHash'
