name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  contracts:
    name: Contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      # Pinned: the indexer's replay fixture is generated by `forge test` and diffed below, so
      # CI must run the same Foundry that produced the committed copy.
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.5.1

      - name: Build
        working-directory: contracts
        run: forge build --sizes

      - name: Test
        working-directory: contracts
        run: forge test -vv

      # The web app and the indexer both carry copies of the ABIs, and the indexer's replay
      # test carries a trace recorded by IndexerTrace.t.sol (written by the test step above).
      # Regenerate all of them and fail if anything committed is stale.
      - name: Generated artifacts are current
        run: |
          (cd web && node scripts/abis.mjs)
          node indexer/scripts/sync.mjs --check
          git diff --exit-code -- web/lib/abis.ts indexer/abis indexer/config.yaml indexer/test/fixtures

      - name: Fail on any lint finding in src
        working-directory: contracts
        run: |
          # forge-lint notes are advisory, so grep for ones pointing at our own source.
          # Library and test findings are out of scope; src is held to zero.
          findings=$(forge build --force 2>&1 | grep -A2 -E '^(warning|note)\[' | grep -cE '^\s+-->\s+src/' || true)
          echo "src findings: $findings"
          test "$findings" -eq 0

  web:
    name: Front end
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Install
        working-directory: web
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        working-directory: web
        run: pnpm typecheck

      - name: Build
        working-directory: web
        run: pnpm build

  oracle:
    name: Oracle workflow
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install
        working-directory: oracle
        run: pnpm install

      # Two programs, on purpose: the workflow is checked against the CRE SDK's sandbox types,
      # the simulator against plain Node. One program would let the SDK's global `fs: never`
      # leak into the simulator — which is how a typecheck failure once shipped unnoticed.
      - name: Typecheck
        working-directory: oracle
        run: pnpm typecheck

      - name: Simulate
        working-directory: oracle
        run: pnpm simulate

  indexer:
    name: Envio indexer
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: indexer/pnpm-lock.yaml

      - name: Install
        working-directory: indexer
        run: pnpm install --frozen-lockfile

      - name: Codegen
        working-directory: indexer
        run: pnpm codegen

      - name: Typecheck
        working-directory: indexer
        run: pnpm typecheck

      # Replays logs recorded from the real contracts and checks every position, cost basis and
      # open-interest figure against what the contracts reported. No network, no database.
      - name: Test
        working-directory: indexer
        run: pnpm test

  tools:
    name: Scheduled publisher
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Test
        run: node --test tools/publish-index.test.mjs
