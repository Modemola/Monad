name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  contracts:
    name: Contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: foundry-rs/foundry-toolchain@v1

      - name: Build
        working-directory: contracts
        run: forge build --sizes

      - name: Test
        working-directory: contracts
        run: forge test -vv

      - name: Fail on any lint finding in src
        working-directory: contracts
        run: |
          # forge-lint notes are advisory, so grep for ones pointing at our own source.
          # Library and test findings are out of scope; src is held to zero.
          findings=$(forge build --force 2>&1 | grep -A2 -E '^(warning|note)\[' | grep -cE '^\s+-->\s+src/' || true)
          echo "src findings: $findings"
          test "$findings" -eq 0

  web:
    name: Front end
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Install
        working-directory: web
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        working-directory: web
        run: pnpm typecheck

      - name: Build
        working-directory: web
        run: pnpm build
