[profile.default]
src = "src"
out = "out"
libs = ["lib"]
test = "test"
script = "script"
solc = "0.8.30"
optimizer = true
optimizer_runs = 1_000_000
via_ir = false
evm_version = "cancun"
fs_permissions = [
  { access = "read", path = "./data" },
  { access = "read-write", path = "./deployments" },
]
remappings = [
  "forge-std/=lib/forge-std/src/",
  "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/",
  "solady/=lib/solady/src/",
]

[lint]
# Immutables stay lowerCamelCase on purpose: they are part of the public ABI, and
# `market.index()` reads better from a front end than `market.INDEX()`.
exclude_lints = ["screaming-snake-case-immutable"]

[fmt]
line_length = 110
tab_width = 4
bracket_spacing = false
int_types = "long"

[rpc_endpoints]
monad_testnet = "${MONAD_TESTNET_RPC_URL}"
monad_mainnet = "${MONAD_MAINNET_RPC_URL}"
